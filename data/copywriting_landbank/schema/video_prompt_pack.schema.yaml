schema_version: "1.0"
file: video_prompt_pack.csv
description: >
  Engine-neutral video creative brief pack for MWTCB_25ML.
  Each row is a fully self-contained prompt brief — all copy fields, guardrails,
  and metadata are direct columns. No joins to source matrices required.
  next_adapter_stage is always OPERATOR_REVIEW. No Grok/Veo/Sora/Kling prompts are generated here.
required_columns:
  - video_prompt_pack_id
  - product_id
  - video_matrix_id
  - motivation_id
  - angle_id
  - hook_id
  - subhook_id
  - usp_id
  - cta_id
  - video_format
  - video_duration_fit
  - platform_surface_fit
  - dialogue_language
  - copy_tone
  - hook_text
  - subhook_text
  - usp_text
  - cta_text
  - scene_direction
  - opening_visual
  - product_role
  - proof_visual
  - cta_delivery
  - product_truth_lock
  - visual_guardrails
  - dialogue_guardrails
  - overlay_guidance
  - engine_neutral_prompt_brief
  - negative_prompt_rules
  - raw_claim_tolerance
  - production_review_required
  - operator_edit_required
  - recommended_engine_family
  - next_adapter_stage
  - priority_score
  - source_batch
  - prompt_pack_status
primary_key: video_prompt_pack_id
enums:
  raw_claim_tolerance:
    - LOW
    - MEDIUM
    - HIGH
  production_review_required:
    - "YES"
    - "NO"
  operator_edit_required:
    - "YES"
    - OPTIONAL
    - "NO"
  next_adapter_stage:
    - OPERATOR_REVIEW
  prompt_pack_status:
    - READY_FOR_OPERATOR_REVIEW
policy:
  raw_copywriting_matrix: true
  no_engine_specific_prompts: true
  no_notion_api: true
  operator_edit_required_is_routing_field_not_deletion_filter: true
  engine_neutral_prompt_brief_is_brief_not_final_prompt: true
