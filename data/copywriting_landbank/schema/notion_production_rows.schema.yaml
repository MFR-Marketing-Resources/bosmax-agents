schema_version: "1.0"
file: notion_production_rows.csv
description: >
  Canonical Notion production row export for MWTCB_25ML.
  Each row is a fully self-contained production record linking a Part 7 matrix entry
  to a Part 8 prompt pack. All copywriting fields are direct columns — no joins required.
  operator_edit_required is a metadata routing field, not a deletion filter.
required_columns:
  - notion_row_id
  - product_id
  - production_type
  - source_matrix_id
  - prompt_pack_id
  - motivation_id
  - angle_id
  - hook_id
  - subhook_id
  - usp_id
  - cta_id
  - angle_name
  - angle_family
  - buyer_stage
  - persona_fit
  - boldness_level
  - usage_context
  - sales_mechanism
  - primary_bucket
  - secondary_bucket
  - headline_or_hook
  - subheadline_or_subhook
  - usp_text
  - cta_text
  - format_family
  - platform_surface_fit
  - creative_output_type
  - raw_claim_tolerance
  - production_review_required
  - operator_edit_required
  - recommended_view
  - priority_score
  - production_notes
  - source_batch
  - row_status
primary_key: notion_row_id
enums:
  production_type:
    - video
    - poster
  raw_claim_tolerance:
    - LOW
    - MEDIUM
    - HIGH
  production_review_required:
    - "YES"
    - "NO"
  operator_edit_required:
    - "YES"
    - OPTIONAL
    - "NO"
  creative_output_type:
    - VIDEO_CREATIVE_BRIEF
    - POSTER_CREATIVE_BRIEF
  recommended_view:
    - OPERATOR_FIRST
    - BATCH_REVIEW
    - DIRECT_PUBLISH
policy:
  raw_copywriting_matrix: true
  no_notion_api: true
  no_engine_specific_prompts: true
  operator_edit_required_is_routing_field_not_deletion_filter: true
