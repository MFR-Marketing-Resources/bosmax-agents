version: 1
module_lane: video_template_compiler_runtime
status: IN_PROGRESS
purpose: >
  Governed executable runtime for BOSMAX video template parsing, normalization,
  master storyboard generation, block script generation, engine-specific prompt
  compilation, QA validation, and Notion-ready export.
enums:
  product_lane:
    - BOSMAX
    - MINYAK_WARISAN_TOK
    - MULTI_PRODUCT
    - ON_THE_FLY
  engine:
    - GROK
    - GOOGLE_FLOW
    - VEO
    - VEO_3_1
    - VEO_3_1_LITE
  mode:
    - FRAMES
    - INGREDIENTS
    - HYBRID
  intake_mode:
    # Optional operator-facing asset-intake pattern. Empty string when unset.
    # Input aliases normalize: HYBRID->PRODUCT_ONLY, FRAMES->READY_FRAME,
    # INGREDIENTS->ASSET_SET. Distinct from the compiler `mode` enum above.
    - PRODUCT_ONLY
    - READY_FRAME
    - ASSET_SET
  block_mode:
    - SINGLE_BLOCK
    - MULTI_BLOCK
  prompt_execution_mode:
    - ONE_SHOT
    - SEQUENTIAL
    - EXTENSION_CHAIN
    - EXTENSION
    - CLIP_CHAIN
    - FLOW_EXTEND_UI
    - FLOW_EXTEND_10S
  qa_status:
    - PASS
    - WARN
    - FAIL
    - NOT_RUN
  prompt_surface_status:
    - DRAFT
    - COMPILED
    - BLOCKED
  output_mode:
    - SINGLE_PROMPT
    - MULTI_PROMPT_SET
required_paths:
  - template_id
  - template_name
  - identity.product_lane
  - identity.platform
  - identity.engine
  - identity.mode
  - duration.duration_seconds
  - duration.block_mode
  - duration.block_count
  - duration.block_plan
  - duration.prompt_execution_mode
  - input.raw_prompt_seed
  - parsed.parsed_brief
  - parsed.hook
  - parsed.body
  - parsed.cta
  - storyboard.master_storyline
  - storyboard.master_storyboard
  - storyboard.block_script_json
  - compiler.engine_adapter
  - compiler.compiler_version
  - compiler.output_mode
  - compiler.prompt_set_count
  - compiler.prompt_sets
  - compiler.final_prompt_text
  - compiler.final_prompt_blocks
  - compiler.prompt_surface_status
  - qa.qa_status
  - qa.qa_errors
  - qa.qa_warnings
  - qa.production_ready
  - qa.export_ready
  - qa.notion_ready
  - qa.source_traceability
  - qa.generated_at
  - qa.generated_by
sections:
  identity:
    source_angle_id: Optional upstream angle intelligence identifier.
    copypack_id: Optional copywriting record identifier.
    product_lane: Canonical product lane anchor.
    platform: Requested publishing platform.
    engine: Canonical BOSMAX engine key.
    mode: Template authoring mode.
    intake_mode: Optional operator-facing asset-intake pattern (PRODUCT_ONLY, READY_FRAME, ASSET_SET); empty when unset. Distinct from `mode`.
    template_category: Logical template family.
    output_type: Expected downstream output surface.
    commercial_angle_id: Optional commercial angle id for landbank traceability (falls back to source_angle_id on export).
    commercial_angle_name: Optional human-readable commercial angle name.
    pilot_batch: Optional operator batch tag for pilot/100-row import grouping.
  duration:
    duration_seconds: Total requested video duration in seconds.
    duration_label: Human-readable duration label.
    block_mode: Single-block versus multi-block runtime mode.
    block_count: Deterministic number of runtime blocks.
    block_plan: Deterministic block duration array.
    prompt_execution_mode: Engine-specific execution mode.
    continuity_requirement: Runtime continuity rule.
  input:
    raw_prompt_seed: Canonical raw seed retained separately from final prompts.
    source_landbank_row: Optional landbank trace.
    visual_seed: Optional visual seed text.
    copy_seed: Optional copy seed text.
    overlay_seed: Optional overlay seed text.
    product_truth_ref: Product truth reference path or record.
    compliance_notes: Free-form compliance notes.
  parsed:
    parsed_brief: Normalized brief summary.
    hook: Opening spoken or visual hook.
    body: Development/proof body.
    cta: Closing CTA.
    risk_class: Simple risk grade for early screening.
    claim_class: Claim handling class.
    overlay_allowed: True only when the operator explicitly opts into text overlay; otherwise Section 9 stays NO_OVERLAY and overlay/subtitle text is blocked.
    forbidden_claims: Explicit forbidden claim phrases.
    forbidden_visuals: Explicit forbidden visual phrases.
  storyboard:
    master_storyline: High-level story arc sentence.
    master_storyboard: Cross-block storyboard summary.
    narrative_arc: Ordered narrative beat labels.
    character_continuity_lock: Character continuity anchor.
    product_continuity_lock: Product continuity anchor.
    setting_camera_lock: Setting and camera continuity anchor.
    block_script_json: Deterministic per-block script payload.
  compiler:
    engine_adapter: Engine adapter selected by compiler.
    compiler_version: Compiler build string.
    output_mode: SINGLE_PROMPT for one block, MULTI_PROMPT_SET for any multi-block export.
    prompt_set_count: Number of final prompt sets emitted by the compiler.
    prompt_sets: Structured per-set prompt payloads with 9 sections, per-block WPS reporting, and continuation metadata.
    final_prompt_text: Joined final prompt surface.
    final_prompt_blocks: Per-block final prompt surfaces.
    prompt_surface_status: Draft versus compiled versus blocked.
  qa:
    qa_status: Runtime QA result.
    qa_errors: Hard fail reasons.
    qa_warnings: Non-blocking warnings.
    production_ready: Hard gate for production execution.
    export_ready: Export gate.
    notion_ready: Notion handoff gate.
    source_traceability: Input/output provenance data.
    generated_at: UTC timestamp.
    generated_by: Runtime identifier.
supported_block_plans:
  - [6]
  - [8]
  - [10]
  - [10, 6]
  - [8, 8]
  - [10, 10]
  - [8, 8, 8]
  - [10, 8]
  - [10, 10, 10]
  - [10, 10, 10, 10]
  - [10, 10, 10, 10, 10]
  - [10, 10, 10, 10, 10, 10]
unsupported_block_plans:
  - [4, 4, 4, 4]
governance_rules:
  - Multi-block templates must carry a master storyboard and continuity locks before compilation.
  - Raw seed text and compiled final prompt text must remain separate export surfaces.
  - Marker tokens such as CTX_, CAM_, CLASS_, SCRIPT_, DNA_, ANCHOR_, TRG, TEMP_, SCENE_, BLOCK_, INTERVAL_, REF_, IMG_, VID_, AUDIO_, GEN_, and RENDER_ must not leak into final prompt output.
  - Unsafe claims such as cure, guaranteed result, sexual-performance uplift, or risky direct-body-use instructions must block production readiness.
  - Section 9 overlay defaults to NO_OVERLAY; overlay, subtitle, or on-screen-text instructions are blocked unless overlay_allowed is explicitly set, and any allowed overlay must stay bounded and never cover the product label or visual truth.
  - The operator supplies engine, duration, and intake_mode only; the runtime derives block_plan deterministically. Operators must not hand-author block_plan, child block rows, or final_prompt_text.
  - Google Flow runs two deterministic lanes that never mix inside one render. FLOW_EXTEND_UI is the 8s chain (8, 16=[8,8], 24=[8,8,8]); FLOW_EXTEND_10S is the 10s extend lane (10, 18=[10,8], 20=[10,10], 30/40/50/60 repeated 10s). Google Flow must never use the GROK [10,6] split, and GROK must never use an 8s block.
  - Any multi-block runtime must export output_mode=MULTI_PROMPT_SET, prompt_set_count=len(block_plan), and one complete 9-section prompt per block. Multi-block prompts must never collapse into one combined 9-section surface.
