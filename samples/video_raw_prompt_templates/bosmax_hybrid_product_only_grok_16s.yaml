# BOSMAX RAW PROMPT TEMPLATE — HYBRID / PRODUCT_ONLY — GROK 16s
# Layer: user-facing raw prompt template (operator copy-paste).
# Authority: docs/video_raw_prompt_template_contract_v1.md
# The operator writes engine + duration + intake_mode + creative detail.
# The runtime derives block_plan (GROK 16s = [10, 6]); the operator never
# hand-authors block_plan, child rows, or final_prompt_text.

template_id: BOSMAX_RAW_HYBRID_PRODUCT_ONLY_GROK_16S
template_name: BOSMAX Serum Hybrid Product-Only (GROK 16s)

# --- routing (operator-supplied) ---
engine: GROK
duration: 16s
intake_mode: HYBRID            # normalizes to PRODUCT_ONLY
platform: TikTok
language: Malay
product_lane: BOSMAX
# block_plan: intentionally absent — runtime derives GROK 16s = [10, 6]

# --- product truth (HYBRID: the uploaded product image is the truth source) ---
product_input: "Uploaded product image only: BOSMAX Serum 5ML roll-on (no avatar uploaded)."
product_truth_ref: products/BOSMAX_SERUM.yaml
product_truth_lock: >
  BOSMAX Serum 5ML / BOSMAX HERBS Herbal Oil Roll On. Preserve the exact tiny
  slim matte-black cylindrical roll-on bottle, glossy black cap, white BOSMAX
  HERBS wordmark, leaf icon, and "Herbal Oil Roll On" label. Do not enlarge,
  stretch, relabel, recolor, redesign, duplicate, crop, replace, or change the
  cap/body proportion. Never render it as a perfume, spray, supplement,
  skincare-serum, or tall cosmetic bottle.
scale_lock: "EXACTLY lip balm size / EXACTLY chapstick size; fits into fingers naturally."

# --- avatar (HYBRID: not uploaded; assembled from pool / description) ---
avatar_source: AVATAR_POOL
avatar_brief: "Malaysian adult presenter from the approved avatar pool, natural UGC look, one-hand product hold; BOSMAX selects the exact persona."

# --- action + dialogue (spoken Malay; CTA spoken; dialogue_required defaults YES) ---
action_seed: "Presenter speaks to camera, opens cap, quick roll-on motion, and keeps the product visible near chest level instead of drifting into product-only coverage."
continuation_action_seed: "Part 1 ends continuation-ready: same hand, same grip, same label direction, same camera distance, mouth still live. Part 2 starts from that exact visible state, resumes inside 0.2-0.5s, and keeps face/mouth visible before any beauty framing."
dialogue_seed: "Hook (pain) -> friction (bulky products) -> relief (compact roll-on) -> spoken CTA. Continuation stays direct on-camera Malay speech only: no voice-over, no off-camera narration, no product-only cutaway carrying the line."
hook: "Tengah hari rasa panas, badan tak selesa sepanjang hari kan?"
body: "Produk lain besar menyusahkan, berat, tak muat poket bila keluar rumah, susah nak bawa ke mana-mana setiap masa. BOSMAX roll-on kecil macam lip balm, sapu sekali terus lega."
cta: "Tap tengok harga sekarang, boss."
visual_seed: "Brisk handheld UGC framing, product in palm, quick cap-open motion, same hand/grip/label direction across the seam, label readable."

# --- safety / overlay ---
overlay_allowed: false         # Section 9 defaults NO_OVERLAY
safety_guardrails: "No medical cure / guaranteed-result / sexual-performance claims; no risky direct-body-use instructions."
forbidden_claims:
  - menyembuhkan penyakit
