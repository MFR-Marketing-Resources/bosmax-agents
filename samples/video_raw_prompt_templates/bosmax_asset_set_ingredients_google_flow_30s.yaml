# BOSMAX RAW PROMPT TEMPLATE — INGREDIENTS / ASSET_SET — GOOGLE_FLOW 30s
# Layer: user-facing raw prompt template (operator copy-paste).
# Authority: docs/video_raw_prompt_template_contract_v1.md
# Demonstrates the Google Flow 10s extend lane: runtime derives 30s = [10,10,10].

template_id: BOSMAX_RAW_ASSET_SET_INGREDIENTS_GOOGLE_FLOW_30S
template_name: BOSMAX Asset-Set Ingredients (Google Flow 30s)

# --- routing (operator-supplied) ---
engine: GOOGLE_FLOW
duration: 30s
intake_mode: ASSET_SET         # canonical (alias INGREDIENTS)
presenter_route: PRESENTER_HYBRID
platform: TikTok
language: Malay
product_lane: BOSMAX
# block_plan: intentionally absent — runtime derives GOOGLE_FLOW 30s = [10,10,10]

# --- asset role map (product truth outranks avatar and style) ---
asset_role_map:
  image_1: PRODUCT_REFERENCE     # product truth (highest authority)
  image_2: AVATAR_REFERENCE      # identity / wardrobe / pose
  image_3: STYLE_SCENE_REFERENCE # optional: mood / environment only
asset_hierarchy: "PRODUCT_TRUTH > AVATAR_IDENTITY > STYLE_SCENE"
product_truth_ref: products/BOSMAX_SERUM.yaml
product_truth_lock: >
  BOSMAX Serum 5ML / BOSMAX HERBS Herbal Oil Roll On. Preserve the exact tiny
  slim matte-black cylindrical roll-on bottle, glossy black cap, white BOSMAX
  HERBS wordmark, leaf icon, and "Herbal Oil Roll On" label. Do not enlarge,
  stretch, relabel, recolor, redesign, duplicate, crop, replace, or change the
  cap/body proportion. Never render it as a perfume, spray, supplement,
  skincare-serum, or tall cosmetic bottle.
scale_lock: "EXACTLY lip balm size / EXACTLY chapstick size; fits into fingers naturally."
avatar_reference_lock: "Use image_2 for identity / wardrobe / pose generally; uploaded avatar overrides any registry persona."
style_scene_limit: "image_3 influences mood / environment / lighting only; it must never override product identity or avatar identity."

# --- action + dialogue (spoken Malay; CTA spoken) ---
action_seed: "Avatar interacts naturally with the product across three continuous 10s beats; proof handling in the middle beat, spoken CTA in the final beat."
dialogue_seed: "Hook (pain) -> friction -> relief (product) -> proof -> spoken CTA, spread across three 10s extend blocks."
hook: "Tengah hari rasa lesu, badan tak bermaya betul kan?"
body: "Banyak produk lain besar menyusahkan, makan ruang, tak muat poket bila kita keluar rumah setiap hari kan. BOSMAX roll-on ni pula kecil macam lip balm, ringan, senang digenggam, dan cukup sapu sekali sahaja terus rasa lega dan segar dengan cepat tanpa rasa leceh langsung. Simpan dalam beg, kereta, atau poket pun muat dengan mudah, jadi anda boleh guna bila-bila masa yang diperlukan pada setiap hari."
cta: "Tap tengok harga sekarang."
visual_seed: "Three-beat UGC cadence; product truth from product reference; avatar interacts naturally; label readable across each extend seam."

# --- safety / overlay ---
overlay_allowed: false         # Section 9 defaults NO_OVERLAY
safety_guardrails: "No medical cure / guaranteed-result / sexual-performance claims; no risky direct-body-use instructions."
forbidden_claims:
  - menyembuhkan penyakit
